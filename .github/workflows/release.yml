name: Release

# Tag push (vX.Y.Z, or vX.Y.Z+hotfix -- see docs/release-process.md) on
# master is the deliberate "publish this exact commit" action. Deliberately
# no `paths` filter and no `branches` filter -- a release always builds
# fresh binaries from the tagged commit and always publishes, regardless of
# which files that commit happened to touch. Kept as a separate workflow
# from build-gateway.yml (the rolling gateway-latest dev channel
# install.sh actually tracks) rather than folding tag-push into that same
# trigger, so the two channels' semantics never depend on how GitHub
# Actions resolves a combined branches+paths+tags filter -- see
# docs/release-process.md "Разделение каналов релизов".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: mipsle, gomips: softfloat, name: mipsle-softfloat }
          - { goos: linux, goarch: mips,   gomips: softfloat, name: mips-softfloat }
          - { goos: linux, goarch: arm,    goarm: "7",        name: arm7 }
          - { goos: linux, goarch: arm64,  name: arm64 }
          - { goos: linux, goarch: amd64,  name: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Build
        working-directory: gateway
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          out="smartroute-gateway-${{ matrix.name }}"
          go build -ldflags "-s -w" -o "$out" .
          gzip -k "$out"
          echo "ASSET=gateway/${out}.gz" >> "$GITHUB_ENV"

      # Pulls this exact version's own section out of CHANGELOG.md (between
      # its "## [X.Y.Z]" heading and the next one) instead of a generic
      # "see CHANGELOG.md" pointer -- opening a release used to always mean
      # a second trip to the changelog to find out what actually changed.
      # Requires the tag's own CHANGELOG.md entry to already exist in this
      # commit (docs/release-process.md's own step order already puts the
      # changelog commit before the tag).
      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "См. CHANGELOG.md для списка изменений этой версии." > release_notes.md
            echo "" >> release_notes.md
            echo "See CHANGELOG.md for this version's changelog." >> release_notes.md
          fi
          cat release_notes.md

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "XKeen SmartRoute ${{ github.ref_name }}"
          body_path: release_notes.md
          prerelease: false
          files: ${{ env.ASSET }}
