name: Update domain/IP lists

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify candidates, refresh lists/custom + lists/ip, build changelog
        id: refresh
        run: python3 scripts/update_lists.py

      - name: Commit changes
        if: steps.refresh.outputs.has_changes == 'true'
        run: |
          git config user.name "xkeen-smartroute-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lists/custom lists/ip
          git commit -m "chore: auto-refresh domain/IP lists ($(date -u +%Y-%m-%d))"
          git push

      - name: Publish a Release with the changelog
        if: steps.refresh.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lists-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          gh release create "$tag" \
            --title "Domain/IP lists — $(date -u +%Y-%m-%d)" \
            --notes-file RELEASE_NOTES.md
