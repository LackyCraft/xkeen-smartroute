<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XKeen SmartRoute</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sr-aurora" aria-hidden="true">
  <span class="sr-blob sr-blob-1"></span>
  <span class="sr-blob sr-blob-2"></span>
</div>

<!-- ================= Login screen ================= -->
<div id="sr-login-screen" class="sr-login-screen" hidden>
  <form id="sr-login-form" class="sr-login-card">
    <h1 data-i18n="login_title">Вход</h1>
    <img class="sr-login-logo" src="logo.png" alt="SmartRoute">
    <input type="password" id="sr-login-password" class="sr-input" data-i18n-placeholder="login_password_placeholder" placeholder="Пароль" autofocus>
    <button type="submit" class="sr-btn sr-btn-primary" data-i18n="login_btn">Войти</button>
    <p id="sr-login-error" class="sr-error" hidden></p>
  </form>
</div>

<!-- ================= App shell ================= -->
<div id="sr-app-shell" class="sr-shell" hidden>
  <aside class="sr-sidebar" id="sr-sidebar">
    <a class="sr-brand" href="https://github.com/LackyCraft/xkeen-smartroute" target="_blank" rel="noopener">
      <img src="logo.png" alt="">
      <span><strong>XKeen SmartRoute</strong><small>byLC</small></span>
    </a>
    <nav>
      <button class="sr-nav-item" data-section="home"><span class="sr-nav-ico">📊</span><span data-i18n="nav_home">Статус</span></button>
      <button class="sr-nav-item" data-section="subscriptions"><span class="sr-nav-ico">📡</span><span data-i18n="nav_subscriptions">Подписки</span></button>
      <button class="sr-nav-item" data-section="profiles"><span class="sr-nav-ico">🗂️</span><span data-i18n="nav_profiles">Профили</span></button>
      <button class="sr-nav-item" data-section="killswitch"><span class="sr-nav-ico">🛑</span><span data-i18n="nav_killswitch">Kill-Switch</span></button>
      <button class="sr-nav-item" data-section="protection"><span class="sr-nav-ico">🛡️</span><span data-i18n="nav_protection">Защита от утечек</span></button>
    </nav>
    <div class="sr-sidebar-footer">
      <button class="sr-nav-item" id="sr-lang-btn">EN</button>
      <button class="sr-nav-item" id="sr-logout-btn" data-i18n="logout_btn">Выйти</button>
    </div>
  </aside>

  <div class="sr-main">
    <div class="sr-topbar">
      <button class="sr-burger" id="sr-burger-btn" aria-label="Menu">☰</button>
      <strong id="sr-topbar-title">XKeen SmartRoute</strong>
    </div>

    <section class="sr-section" id="sr-section-home"></section>
    <section class="sr-section" id="sr-section-subscriptions" hidden></section>
    <section class="sr-section" id="sr-section-profiles" hidden></section>
    <section class="sr-section" id="sr-section-killswitch" hidden></section>
    <section class="sr-section" id="sr-section-protection" hidden></section>
  </div>
</div>

<div id="sr-toasts" class="sr-toasts"></div>

<script src="app.js"></script>
<script src="status.js"></script>
<script src="subscriptions.js"></script>
<script src="profiles.js"></script>
<script src="killswitch.js"></script>
<script src="protection.js"></script>
</body>
</html>
